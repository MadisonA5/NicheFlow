spring:
  application:
    name: nicheflow-backend

  datasource:
    url: ${NICHEFLOW_DB_URL:jdbc:postgresql://localhost:5432/nicheflow}
    username: ${NICHEFLOW_DB_USERNAME:nicheflow}
    password: ${NICHEFLOW_DB_PASSWORD:nicheflow}

  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it at startup.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

nicheflow:
  jwt:
    # Dev-only fallback so the app starts on a fresh clone. Production and CI must set
    # NICHEFLOW_JWT_SECRET to random data, base64 or plain, of at least 32 bytes for HS256.
    secret: ${NICHEFLOW_JWT_SECRET:nicheflow-dev-only-insecure-signing-key-change-me}
    expiration: PT1H

logging:
  level:
    org.flywaydb: info
